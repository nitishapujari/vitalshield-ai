name: vitalshield_ai
description: "VitalShield AI - Your Intelligent Wellness Companion"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.8.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Icons
  flutter_lucide: ^1.6.0

  # Fonts
  google_fonts: ^6.2.1

  # Animations
  flutter_animate: ^4.5.2

  # Storage
  shared_preferences: ^2.3.4

  # Utilities
  intl: ^0.19.0

  # Environment
  flutter_dotenv: ^5.2.1
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env
    

  # Font infrastructure ready for Satoshi swap
  # Download from https://www.fontshare.com/fonts/satoshi
  # Place TTF files in assets/fonts/ and uncomment below:
  # fonts:
  #   - family: Satoshi
  #     fonts:
  #       - asset: assets/fonts/Satoshi-Light.ttf
  #         weight: 300
  #       - asset: assets/fonts/Satoshi-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Satoshi-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Satoshi-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Satoshi-Black.ttf
  #         weight: 900
